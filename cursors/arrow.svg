<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">
  <!-- Win98-style default arrow cursor. Hotspot at tip (2,2).
       paint-order="stroke fill" draws stroke behind fill, so only the
       outer half of the stroke is visible — giving a clean 1px black outline. -->
  <path d="M2,2 L2,20 L6,15 L9,23 L11,22 L8,14 L14,14 Z"
        fill="white" stroke="black" stroke-width="2" stroke-linejoin="miter"
        paint-order="stroke fill"/>
</svg>
