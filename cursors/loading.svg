<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">
  <!-- Win98 hourglass / busy cursor. Hotspot at centre (16,16). -->
  <!-- Top and bottom caps -->
  <rect x="9" y="5"  width="14" height="2" fill="black"/>
  <rect x="9" y="25" width="14" height="2" fill="black"/>
  <!-- Hourglass silhouette: two triangles sharing a centre tip -->
  <polygon points="9,7 23,7 16,16 9,25 23,25 16,16" fill="black"/>
  <!-- Upper sand (draining — full triangle) -->
  <polygon points="10,8 22,8 16,14" fill="white"/>
  <!-- Lower sand (accumulating — smaller triangle at bottom) -->
  <polygon points="12,24 20,24 16,19" fill="white"/>
</svg>
